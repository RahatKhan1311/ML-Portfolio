<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stock Anomaly Explainer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Space Grotesk', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
          },
          colors: {
            navy: { 950: '#050d1a', 900: '#0a1628', 800: '#0f2040', 700: '#1a3060' },
            electric: { DEFAULT: '#3b82f6', dark: '#2563eb', glow: '#60a5fa' },
          },
          boxShadow: {
            glow: '0 0 20px rgba(59,130,246,0.3)',
            'glow-red': '0 0 15px rgba(239,68,68,0.4)',
            'glow-green': '0 0 15px rgba(34,197,94,0.4)',
          }
        }
      }
    }
  </script>
  <style>
    body { background: #050d1a; font-family: 'Inter', sans-serif; }
    h1, h2, h3, .font-display { font-family: 'Space Grotesk', sans-serif; }

    .anomaly-dot {
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.3); }
    }

    .card-enter {
      animation: slide-up 0.4s ease forwards;
      opacity: 0;
    }
    @keyframes slide-up {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .ticker-input:focus { box-shadow: 0 0 0 2px #3b82f6, 0 0 20px rgba(59,130,246,0.2); }

    .sentiment-positive { background: rgba(34,197,94,0.12); color: #4ade80; border: 1px solid rgba(34,197,94,0.25); }
    .sentiment-negative { background: rgba(239,68,68,0.12); color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
    .sentiment-neutral  { background: rgba(148,163,184,0.1); color: #94a3b8; border: 1px solid rgba(148,163,184,0.2); }

    .grid-bg {
      background-image: linear-gradient(rgba(59,130,246,0.04) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(59,130,246,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a1628; }
    ::-webkit-scrollbar-thumb { background: #1a3060; border-radius: 3px; }

    .loading-bar {
      animation: loading 1.5s ease-in-out infinite;
      background: linear-gradient(90deg, #0f2040 0%, #3b82f6 50%, #0f2040 100%);
      background-size: 200% 100%;
    }
    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
  </style>
</head>
<body class="min-h-screen grid-bg text-slate-200">

  <!-- Header -->
  <header class="border-b border-navy-800 border-opacity-60 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-electric flex items-center justify-center shadow-glow">
        <svg class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
        </svg>
      </div>
      <span class="font-display font-700 text-white text-lg tracking-tight">AnomalyIQ</span>
    </div>
    <span class="text-xs text-slate-500 font-body">Powered by Isolation Forest + LLM</span>
  </header>

  <!-- Hero -->
  <section class="max-w-4xl mx-auto px-6 pt-16 pb-10 text-center">
    <p class="text-electric text-xs font-display font-600 tracking-widest uppercase mb-4">AI-Powered Market Intelligence</p>
    <h1 class="font-display font-700 text-4xl md:text-5xl text-white leading-tight mb-4">
      Why did the stock<br/>
      <span class="text-electric">move like that?</span>
    </h1>
    <p class="text-slate-400 font-body text-base max-w-lg mx-auto mb-10">
      Enter any ticker. We detect statistically unusual price movements and use AI to explain what likely caused them.
    </p>

    <!-- Search -->
    <div class="flex items-center justify-center gap-3 flex-wrap">
      <div class="relative">
        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs font-display font-600 tracking-widest">$</span>
        <input
          id="ticker"
          type="text"
          placeholder="AAPL, RELIANCE.NS, TSLA..."
          class="ticker-input bg-navy-900 border border-navy-700 text-white placeholder-slate-600 font-display font-500 text-sm rounded-xl pl-8 pr-5 py-3.5 w-72 outline-none transition-all duration-200"
        />
      </div>
      <button
        id="analyzeBtn"
        onclick="analyze()"
        class="bg-electric hover:bg-electric-dark text-white font-display font-600 text-sm px-7 py-3.5 rounded-xl transition-all duration-200 shadow-glow hover:shadow-lg disabled:opacity-40 disabled:cursor-not-allowed flex items-center gap-2"
      >
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"/><path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
        </svg>
        Analyze
      </button>
    </div>

    <!-- Quick picks -->
    <div class="flex items-center justify-center gap-2 mt-4 flex-wrap">
      <span class="text-slate-600 text-xs">Try:</span>
      <button onclick="quickPick('AAPL')" class="text-xs text-slate-500 hover:text-electric border border-navy-700 hover:border-electric px-3 py-1 rounded-full transition-all duration-150">AAPL</button>
      <button onclick="quickPick('TSLA')" class="text-xs text-slate-500 hover:text-electric border border-navy-700 hover:border-electric px-3 py-1 rounded-full transition-all duration-150">TSLA</button>
      <button onclick="quickPick('RELIANCE.NS')" class="text-xs text-slate-500 hover:text-electric border border-navy-700 hover:border-electric px-3 py-1 rounded-full transition-all duration-150">RELIANCE.NS</button>
      <button onclick="quickPick('NVDA')" class="text-xs text-slate-500 hover:text-electric border border-navy-700 hover:border-electric px-3 py-1 rounded-full transition-all duration-150">NVDA</button>
    </div>
  </section>

  <!-- Status / Error -->
  <div id="statusWrap" class="max-w-4xl mx-auto px-6 hidden">
    <div class="loading-bar h-0.5 rounded-full mb-3"></div>
    <p id="statusText" class="text-center text-slate-400 text-sm font-body"></p>
  </div>
  <div id="errorWrap" class="max-w-4xl mx-auto px-6 hidden">
    <div class="bg-red-950 border border-red-800 border-opacity-50 rounded-xl px-5 py-3 text-red-400 text-sm text-center font-body"></div>
  </div>

  <!-- Results -->
  <main id="results" class="max-w-4xl mx-auto px-6 pb-20"></main>

  <script>
    function quickPick(ticker) {
      document.getElementById('ticker').value = ticker;
      analyze();
    }

    function getSentiment(headline) {
      const h = headline.toLowerCase();
      const pos = ['beat', 'surge', 'jump', 'rally', 'gain', 'record', 'bullish', 'up', 'rise', 'boost', 'strong', 'profit', 'growth', 'high'];
      const neg = ['drop', 'fall', 'decline', 'crash', 'loss', 'miss', 'weak', 'down', 'cut', 'concern', 'warning', 'risk', 'sell', 'slump', 'delay'];
      const posScore = pos.filter(w => h.includes(w)).length;
      const negScore = neg.filter(w => h.includes(w)).length;
      if (posScore > negScore) return 'positive';
      if (negScore > posScore) return 'negative';
      return 'neutral';
    }

    function sentimentBadge(headline) {
      const s = getSentiment(headline);
      const labels = { positive: '▲ Bullish', negative: '▼ Bearish', neutral: '● Neutral' };
      return `<span class="sentiment-${s} text-xs px-2 py-0.5 rounded-full font-display font-500 ml-2 whitespace-nowrap">${labels[s]}</span>`;
    }

    function renderChart(chartData) {
      const { labels, prices, anomalyIndices } = chartData;

      const pointColors = labels.map((_, i) =>
        anomalyIndices.includes(i) ? '#f87171' : 'transparent'
      );
      const pointRadius = labels.map((_, i) =>
        anomalyIndices.includes(i) ? 6 : 0
      );
      const pointHoverRadius = labels.map((_, i) =>
        anomalyIndices.includes(i) ? 9 : 3
      );

      const ctx = document.getElementById('priceChart').getContext('2d');

      const gradient = ctx.createLinearGradient(0, 0, 0, 300);
      gradient.addColorStop(0, 'rgba(59,130,246,0.25)');
      gradient.addColorStop(1, 'rgba(59,130,246,0)');

      new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            data: prices,
            borderColor: '#3b82f6',
            borderWidth: 2,
            backgroundColor: gradient,
            fill: true,
            tension: 0.3,
            pointBackgroundColor: pointColors,
            pointBorderColor: pointColors,
            pointRadius,
            pointHoverRadius,
            pointHoverBackgroundColor: '#f87171',
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { intersect: false, mode: 'index' },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: '#0a1628',
              borderColor: '#1a3060',
              borderWidth: 1,
              titleColor: '#94a3b8',
              bodyColor: '#f1f5f9',
              titleFont: { family: 'Space Grotesk', size: 11 },
              bodyFont: { family: 'Inter', size: 12 },
              callbacks: {
                label: ctx => ` $${ctx.parsed.y.toFixed(2)}`,
                afterLabel: ctx => anomalyIndices.includes(ctx.dataIndex) ? ' ⚠ Anomaly detected' : ''
              }
            }
          },
          scales: {
            x: {
              grid: { color: 'rgba(59,130,246,0.06)' },
              ticks: {
                color: '#475569',
                font: { family: 'Inter', size: 10 },
                maxTicksLimit: 8,
                maxRotation: 0
              },
              border: { color: '#1a3060' }
            },
            y: {
              position: 'right',
              grid: { color: 'rgba(59,130,246,0.06)' },
              ticks: {
                color: '#475569',
                font: { family: 'Inter', size: 10 },
                callback: v => '$' + v.toFixed(0)
              },
              border: { color: '#1a3060' }
            }
          }
        }
      });
    }

    async function analyze() {
      const ticker = document.getElementById('ticker').value.trim();
      const btn = document.getElementById('analyzeBtn');
      const statusWrap = document.getElementById('statusWrap');
      const statusText = document.getElementById('statusText');
      const errorWrap = document.getElementById('errorWrap');
      const results = document.getElementById('results');

      if (!ticker) return;

      btn.disabled = true;
      statusWrap.classList.remove('hidden');
      statusText.textContent = `Fetching ${ticker.toUpperCase()} data and detecting anomalies…`;
      errorWrap.classList.add('hidden');
      results.innerHTML = '';

      try {
        const response = await fetch('/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ticker })
        });
        const data = await response.json();

        statusWrap.classList.add('hidden');

        if (data.error) {
          errorWrap.classList.remove('hidden');
          errorWrap.querySelector('div').textContent = data.error;
          return;
        }

        // Header
        results.innerHTML = `
          <div class="flex items-center justify-between mb-6">
            <div>
              <h2 class="font-display font-700 text-white text-2xl">${data.ticker}</h2>
              <p class="text-slate-500 text-sm mt-0.5">${data.anomalies.length} anomalies detected in the last 6 months</p>
            </div>
            <div class="bg-navy-900 border border-navy-700 rounded-xl px-4 py-2 text-center">
              <p class="text-electric font-display font-700 text-xl">${data.anomalies.length}</p>
              <p class="text-slate-500 text-xs mt-0.5">anomalies</p>
            </div>
          </div>

          <!-- Chart -->
          <div class="bg-navy-900 border border-navy-800 rounded-2xl p-5 mb-8">
            <div class="flex items-center justify-between mb-4">
              <p class="font-display font-600 text-slate-300 text-sm">Price History</p>
              <div class="flex items-center gap-4 text-xs text-slate-500">
                <span class="flex items-center gap-1.5"><span class="w-3 h-0.5 bg-electric inline-block rounded"></span> Price</span>
                <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-red-400 inline-block"></span> Anomaly</span>
              </div>
            </div>
            <div class="h-56">
              <canvas id="priceChart"></canvas>
            </div>
          </div>

          <!-- Cards -->
          <p class="font-display font-600 text-slate-400 text-xs tracking-widest uppercase mb-4">Anomaly Breakdown</p>
          <div id="anomalyCards" class="space-y-4"></div>
        `;

        // Render chart
        if (data.chart) renderChart(data.chart);

        // Render cards
        const cardsEl = document.getElementById('anomalyCards');
        data.anomalies.forEach((a, i) => {
          const isNeg = a.return.includes('-');
          const returnColor = isNeg ? 'text-red-400' : 'text-green-400';
          const returnBg = isNeg ? 'bg-red-950 border-red-800' : 'bg-green-950 border-green-800';
          const returnShadow = isNeg ? 'shadow-glow-red' : 'shadow-glow-green';

          const headlinesHtml = a.headlines[0] === 'No news found' || a.headlines[0] === 'Error fetching news'
            ? `<p class="text-slate-600 text-xs italic">No headlines available — beyond NewsAPI's 30-day window</p>`
            : a.headlines.map(h => `
                <div class="flex items-start justify-between gap-3 py-2.5 border-b border-navy-800 last:border-0">
                  <p class="text-slate-400 text-sm leading-snug flex-1">${h}</p>
                  ${sentimentBadge(h)}
                </div>
              `).join('');

          const card = document.createElement('div');
          card.className = `bg-navy-900 border border-navy-800 hover:border-electric hover:border-opacity-40 rounded-2xl p-5 card-enter transition-all duration-300`;
          card.style.animationDelay = `${i * 80}ms`;
          card.innerHTML = `
            <div class="flex items-center justify-between mb-4">
              <div class="flex items-center gap-3">
                <div class="w-2 h-2 rounded-full ${isNeg ? 'bg-red-400' : 'bg-green-400'} anomaly-dot"></div>
                <span class="font-display font-600 text-white">${a.date}</span>
              </div>
              <span class="font-display font-700 text-lg ${returnColor} ${returnBg} border border-opacity-30 px-3 py-1 rounded-lg ${returnShadow}">${a.return}</span>
            </div>

            <div class="mb-4">
              <p class="text-xs font-display font-600 text-slate-600 tracking-widest uppercase mb-2">News Headlines</p>
              ${headlinesHtml}
            </div>

            <div class="bg-navy-950 border-l-2 border-electric rounded-r-xl px-4 py-3">
              <p class="text-xs font-display font-600 text-electric tracking-widest uppercase mb-2">AI Analysis</p>
              <p class="text-slate-300 text-sm leading-relaxed font-body">${a.explanation}</p>
            </div>
          `;
          cardsEl.appendChild(card);
        });

      } catch (err) {
        statusWrap.classList.add('hidden');
        errorWrap.classList.remove('hidden');
        errorWrap.querySelector('div').textContent = 'Something went wrong. Please try again.';
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('ticker').addEventListener('keypress', e => {
      if (e.key === 'Enter') analyze();
    });
  </script>
</body>
</html>
